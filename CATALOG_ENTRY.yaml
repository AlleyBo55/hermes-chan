# Catalog entry for the Hermes plugin catalog.
#
# To submit: copy this file to `plugin-catalog/hermes-chan.yaml` in a fork of
# NousResearch/hermes-agent, fill `repo` and the full 40-char `sha` (see
# SUBMISSION.md), and open a PR. The `capabilities` block below must match what
# register(ctx) actually registers (catalog rule 5) — keep it in sync with
# plugin.yaml.
name: hermes-chan
repo: https://github.com/AlleyBo55/hermes-chan
sha: "0000000000000000000000000000000000000000"        # TODO: full 40-char commit SHA
maintainer: AlleyBo55
tier: community
category: desktop
version: "0.2.0"
title: "Hermes-chan"
requires_hermes: ">=0.23.0"
docs_url: https://github.com/AlleyBo55/hermes-chan#readme
platforms: [macos, windows, linux]
description: >-
  A living desktop companion for macOS, Windows and Linux: an original chibi
  character who walks, climbs and hops around your screen, stands on your
  windows, watches videos with you, reacts to the agent's activity, and acts on
  the real desktop. She is the body behind the built-in computer_use tool —
  every click/type/drag the agent makes is performed by her, while approval
  gating stays in Hermes above her. You can type into her speech bubble to talk
  to the agent, switch her off with /hermeschan off or Ctrl+Shift+click, and a
  bounded heartbeat-style idle loop lets her peek and react between turns.
  Disclosure — runs a local bridge server (an owner-only AF_UNIX socket on macOS
  and Linux; a 127.0.0.1 port guarded by a random per-run token on Windows) and
  spawns a Rust/Tauri overlay process it builds from source on first run (needs
  a Rust toolchain; set HERMESCHAN_AUTOSTART=0 to disable). As the computer_use
  backend it drives the screen through its source-built native input
  (CoreGraphics on macOS, SendInput on Windows, XTest on Linux/X11) and only
  under Hermes' approval system — it adds no bypass. The body reads the
  on-screen window list and the active window, and moves the active window for
  short pranks (System Events on macOS, SetWindowPos on Windows, EWMH on X11);
  effects are a harmless click-through overlay and never touch the target app;
  tidy_desktop requires a short-lived plan token plus explicit confirmation and
  journals every move for undo. No network calls of its own, no telemetry, no
  credential reads. Unattended runs (CI, kanban workers) do not spawn the body.
known_issues:
  - "Linux needs X11 or XWayland; on Wayland she only sees and acts on X11/XWayland apps."
  - "macOS window move/track uses osascript/System Events (tens of ms per call), so window pranks are gesture-cadence, not per-frame smooth."
  - "The overlay is built from source on first run; without a Rust toolchain the plugin runs headless (tools/hooks only)."
capabilities:
  provides_tools:
    - hermeschan_say
    - hermeschan_emote
    - hermeschan_point_at
    - hermeschan_grab_window
    - hermeschan_glitch_window
    - hermeschan_visual_effect
    - hermeschan_tidy_desktop
    - hermeschan_undo_tidy
  provides_hooks:
    - on_session_start
    - on_session_end
    - pre_llm_call
    - post_llm_call
    - pre_tool_call
    - post_tool_call
    - pre_approval_request
    - on_human_input_request
  provides_middleware: []
  requires_env: []
