name: hermes-chan
label: Hermes-chan
version: 0.2.0
# A general plugin that also offers a computer-use provider. Without an explicit kind, Hermes
# sees register_computer_use_provider in __init__.py and loads it only as that provider.
kind: standalone
requires_hermes: ">=0.23.0"
author: AlleyBo55
license: MIT
homepage: https://github.com/AlleyBo55/hermes-chan
description: >-
  A chibi companion who lives on your desktop: she walks around your screen,
  reacts to what Hermes is doing, and can do its clicks and typing for it.
  Ctrl+Shift+click her to send her away.

optional_env:
  - name: HERMESCHAN_SOCKET
    description: "macOS/Linux: AF_UNIX socket the Python bridge listens on (default <Hermes home>/hermes-chan.sock)"
    prompt: "Overlay socket path"
    password: false

provides_tools:
  - hermeschan_say
  - hermeschan_emote
  - hermeschan_point_at
  - hermeschan_grab_window
  - hermeschan_glitch_window
  - hermeschan_visual_effect
  - hermeschan_tidy_desktop
  - hermeschan_undo_tidy
config_schema:
  mischief:
    type: bool
    default: true
    label: "Mischief"
    description: "Her own pranks on your apps: cracks, portals, glitches, the window falling apart, and now and then a nudge of the active window after you've been idle 20 s."
provides_hooks:
  - on_session_start
  - on_session_end
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - pre_approval_request
  - on_human_input_request
