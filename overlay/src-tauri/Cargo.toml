[package]
name = "hermes-chan-overlay"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Hermes-chan's animated desktop body"
authors = ["AlleyBo55"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
strip = true
# lto intentionally off: this crate is built from source on users' machines,
# so fast first-build time matters more than a few MB of binary size.

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }
# Already in the tree through core-graphics; used directly to read the window list.
core-foundation = "0.10"
# Already in the tree through tao; used to lift her window above the menu bar.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
