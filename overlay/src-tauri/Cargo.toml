[package]
name = "hermes-chan-overlay"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
description = "Hermes-chan's animated desktop body"
authors = ["AlleyBo55"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
strip = true
# lto intentionally off: this crate is built from source on users' machines,
# so fast first-build time matters more than a few MB of binary size.

[target.'cfg(unix)'.dependencies]
# Already in the tree through tauri; used to notice when the Hermes process that started her exits.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }
# Already in the tree through core-graphics; used directly to read the window list.
core-foundation = "0.10"
# Already in the tree through tao; used to lift her window above the menu bar.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Same version tauri uses; window list, window moves, native input and screen capture.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Already in the tree through tauri; encodes window snapshots.
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree through tauri; shapes her window so clicks outside her body pass through.
gtk = "0.18"
# Pure-Rust X11 protocol client (no Xlib error handler to fight GTK over): window list,
# window moves, XTest input, idle time and window snapshots.
x11rb = { version = "0.14", features = ["composite", "screensaver", "xtest"] }
png = "0.18"
