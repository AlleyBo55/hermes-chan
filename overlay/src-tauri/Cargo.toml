[package]
name = "hermes-chan-overlay"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Hermechan's animated desktop body"
authors = ["AlleyBo55"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
# lto intentionally off: this crate is built from source on users' machines,
# so fast first-build time matters more than a few MB of binary size.
