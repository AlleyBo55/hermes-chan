<?xml version="1.0" encoding="UTF-8"?>
<!-- Original placeholder design for Hermechan. Simple geometric chibi-maid built
     from basic shapes. Original work — not based on any existing character or
     logo. Replace with real art per SPRITE_SPEC.md. -->
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="208" viewBox="0 0 192 208">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5d64"/>
      <stop offset="1" stop-color="#20464c"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="96" cy="196" rx="44" ry="9" fill="#000000" opacity="0.12"/>

  <!-- apron dress -->
  <path d="M60 150 Q96 134 132 150 L140 190 Q96 200 52 190 Z" fill="#3a6f77"/>
  <rect x="78" y="140" width="36" height="46" rx="8" fill="#f4f7f6"/>

  <!-- arms -->
  <circle cx="58" cy="156" r="9" fill="#ffe0c4"/>
  <circle cx="134" cy="156" r="9" fill="#ffe0c4"/>

  <!-- head -->
  <circle cx="96" cy="104" r="40" fill="#ffe7d2"/>
  <!-- hair back + bob -->
  <path d="M56 104 Q56 58 96 58 Q136 58 136 104 L136 118 Q120 100 96 100 Q72 100 56 118 Z" fill="url(#hair)"/>
  <!-- bangs -->
  <path d="M62 92 Q96 66 130 92 Q116 86 96 88 Q76 86 62 92 Z" fill="url(#hair)"/>
  <!-- single ahoge -->
  <path d="M96 58 q6 -14 -2 -20 q14 4 10 20 z" fill="url(#hair)"/>

  <!-- maid headband with ORIGINAL diamond emblem (not a logo) -->
  <path d="M66 74 Q96 64 126 74 L126 80 Q96 71 66 80 Z" fill="#ffffff"/>
  <rect x="90" y="69" width="12" height="12" rx="2" transform="rotate(45 96 75)" fill="#7fd1c4"/>

  <!-- eyes -->
  <circle cx="83" cy="108" r="5.5" fill="#20464c"/>
  <circle cx="109" cy="108" r="5.5" fill="#20464c"/>
  <circle cx="84.5" cy="106" r="1.8" fill="#ffffff"/>
  <circle cx="110.5" cy="106" r="1.8" fill="#ffffff"/>
  <!-- blush + smile -->
  <ellipse cx="76" cy="118" rx="5" ry="3" fill="#ffb3a0" opacity="0.7"/>
  <ellipse cx="116" cy="118" rx="5" ry="3" fill="#ffb3a0" opacity="0.7"/>
  <path d="M90 120 Q96 126 102 120" fill="none" stroke="#20464c" stroke-width="2" stroke-linecap="round"/>
</svg>
