<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hermeschan-effect</title>
  <link rel="stylesheet" href="effect.css" />
  <link rel="stylesheet" href="rest.css" />
</head>
<body>
  <!-- Transparent, click-through-by-design overlay. Purely visual: it never
       reads from, writes to, or dispatches input at any target application. -->
  <div id="fx-root" aria-hidden="true">
    <div id="fx-scanlines"></div>
    <div id="fx-rgb"></div>
    <div id="fx-blocks"></div>
    <div id="fx-bend"></div>
    <canvas id="fx-canvas"></canvas>
  </div>
  <!-- Her rest reminder: the one part of this window that takes a click (to close it). -->
  <div id="rest-root" hidden></div>
  <script src="sprite-player.js"></script>
  <script src="effect-canvas.js"></script>
  <script src="effect.js"></script>
  <script src="rest-takeover.js"></script>
</body>
</html>
